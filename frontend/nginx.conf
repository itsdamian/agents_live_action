# React HUD (plan §11.4): static SPA + reverse proxy for /api and /ws to the backend service.

# WebSocket upgrade: send "upgrade" only when the client asked for it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve `backend` per request through Docker's embedded DNS, so Nginx starts even when
    # the backend is not up yet and follows a restarted backend to its new IP.
    # When the name cannot be resolved the request fails with 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $backend_upstream http://backend:8000;

    # REST API -> backend (request URI passed through unchanged).
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    # WebSocket /ws/{project_id} -> backend; long-lived connections.
    location /ws/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Vite's content-hashed bundles: cache for a year. A missing file is a 404, not index.html.
    location /assets/ {
        try_files $uri =404;
        # No `always`: a 404 here must not be cached as immutable.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Replay fixtures keep stable names: always revalidate.
    location /replay/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # The SPA shell must never be cached, or a new deploy would load stale bundle names.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Everything else: a real file if it exists, otherwise the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
