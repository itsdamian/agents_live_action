# CI (specs/live-action-hud Task 26d).
#
#   changes    -> which areas changed (backend / frontend / infra); a push to main or dev and a
#                 manual run always run everything
#   backend    -> pytest unit suite on the langgraph engine and on PIPELINE_ENGINE=legacy, then
#                 the integration tests (Testcontainers starts Postgres on the runner's Docker;
#                 CI=true turns "no Docker" into a failure instead of a skip, see
#                 backend/tests/integration/conftest.py)
#   frontend   -> npm ci, typecheck, Vitest, build, offline Playwright smoke tests (replays served
#                 by vite preview; e2e:live needs a real backend and is not run here)
#   images     -> build the backend and frontend images (never pushed), `docker compose config`
#   secrets    -> gitleaks over the whole history (.gitleaks.toml allows only the fake test keys)
#   actionlint -> lint this workflow
#
# Security: no secrets are referenced anywhere; FORCE_MOCK=true keeps every agent on the mock LLM
# client; every third-party action and image is pinned to a commit SHA / digest.
name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_MOCK: "true"

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      frontend: ${{ steps.diff.outputs.frontend }}
      infra: ${{ steps.diff.outputs.infra }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        name: Which areas changed?
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Pushes to main/dev and manual runs have no reliable base: run everything.
          if [[ "$EVENT" != pull_request ]]; then
            { echo "backend=true"; echo "frontend=true"; echo "infra=true"; } >> "$GITHUB_OUTPUT"
            echo "$EVENT: run everything"; exit 0
          fi
          files="$(git diff --name-only "$PR_BASE...$PR_HEAD")"
          echo "$files"
          has() { grep -cE "$1" <<<"$files" || true; }
          # infra: compose files, Dockerfiles, nginx config, workflows, gitleaks config.
          infra=$(has '^(docker-compose\.yml|compose\.[^/]*\.ya?ml|\.github/|\.gitleaks\.toml$)|(^|/)Dockerfile$|^frontend/nginx\.conf$')
          frontend=$(has '^frontend/')
          # backend: everything else that is not docs or specs (the backend tests also read
          # projects/, .gitignore, .env.example and the compose files).
          backend=$(grep -vE '^(frontend/|specs/)|\.md$' <<<"$files" | grep -c . || true)
          {
            echo "backend=$([[ "$backend" -gt 0 ]] && echo true || echo false)"
            echo "frontend=$([[ "$frontend" -gt 0 ]] && echo true || echo false)"
            echo "infra=$([[ "$infra" -gt 0 ]] && echo true || echo false)"
          } | tee -a "$GITHUB_OUTPUT"

  backend:
    name: backend
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same Python as backend/Dockerfile (python:3.11-slim).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # Same install as backend/Dockerfile.
      - run: pip install -r requirements.txt
      - name: Unit tests (langgraph engine)
        run: pytest -m "not integration" -q
      - name: Unit tests (PIPELINE_ENGINE=legacy)
        env:
          PIPELINE_ENGINE: legacy
        run: pytest -m "not integration" -q
      - name: Integration tests (Testcontainers Postgres)
        run: pytest -m integration -q

  frontend:
    name: frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node 24: package.json engines (>=24) and frontend/Dockerfile (node:24-alpine).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # playwright.config.ts never downloads a browser itself; install the build this
      # Playwright version expects (plus its system libraries). The smoke tests then play the
      # replays against `vite preview` with no backend and no network.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Keep the Playwright traces of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  images:
    name: images
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: docker compose config
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f compose.expose-backend.yml config --quiet
      - name: Build the backend image (not pushed)
        run: docker build -t ala-backend:ci backend
      - name: Build the frontend image (not pushed)
        run: docker build -t ala-frontend:ci frontend

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (whole history; .gitleaks.toml allows only the fake test keys)
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --no-banner --redact --config .gitleaks.toml .

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
