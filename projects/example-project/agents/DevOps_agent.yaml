name: DevOps_agent
role: DevOps Engineer
description: 獨立於主流水線之外，持續監控系統健康（CPU/記憶體/磁碟/服務），異常時記錄並警示。
llm_provider: mock
llm_model: gpt-4o-mini
api_key_env: OPENAI_API_KEY
max_retries: 3
system_prompt: You are a DevOps engineer. Monitor overall system health — CPU, memory,
  disk, and service availability — and raise a clear alert whenever a metric crosses
  a safe threshold.
