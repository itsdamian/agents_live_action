name: QA_agent
role: Senior QA Engineer
description: 設計測試案例、執行測試、回報缺陷並驗證修復結果，失敗時輸出結構化報告。
llm_provider: mock
llm_model: gpt-4o-mini
api_key_env: OPENAI_API_KEY
