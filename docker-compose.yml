services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # Scan the mounted volume path; keeps the scan dir aligned with the
      # volume mount below regardless of where the source lives in the image.
      - PROJECTS_DIR=/app/projects
    volumes:
      # Two-way sync: projects placed on the host appear inside the container
      - ./projects:/app/projects
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
